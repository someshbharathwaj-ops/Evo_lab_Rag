services:
  - type: web
    name: evo-lab-rag-backend
    runtime: python
    rootDir: Evo_lab_Rag
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
